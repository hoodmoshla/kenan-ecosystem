name: Kenan CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  rust-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path rust-core/Cargo.toml

  polkadot-sdk-local-node:
    name: Polkadot SDK local node integration and restart recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt
          targets: wasm32v1-none
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev llvm-dev libssl-dev pkg-config protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: polkadot/sdk/target
          key: ${{ runner.os }}-polkadot-stable2603-7-rust-1.93.0-${{ hashFiles('polkadot/sdk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-polkadot-stable2603-7-rust-1.93.0-
      - name: Build the pinned official Solochain template
        run: ./polkadot/build-node.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: polkadot/integration-test/package-lock.json
      - name: Install the pinned RPC integration-test client
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix polkadot/integration-test
      - name: Run signed transaction, invalid/replay, fee/nonce, finality, RPC outage and restart tests
        run: ./polkadot/test-local.sh

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
        working-directory: android-app
      - uses: actions/upload-artifact@v4
        with:
          name: KenanWallet-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
